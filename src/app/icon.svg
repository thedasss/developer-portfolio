<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="100" height="100" rx="22" fill="#080811" />
  <rect width="100" height="100" rx="22" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-opacity="0.4" fill="none" />

  <!-- Outer Cyber Hexagon -->
  <polygon
    points="50,12 86,31 86,69 50,88 14,69 14,31"
    stroke="url(#cyberGrad)"
    stroke-width="5"
    stroke-linejoin="round"
    fill="#0f0f1a"
    fill-opacity="0.75"
  />

  <!-- Left Code Bracket < -->
  <path
    d="M 34 37 L 22 50 L 34 63"
    stroke="#00d4ff"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Pulse Dot -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />

  <!-- Right Code Bracket > -->
  <path
    d="M 66 37 L 78 50 L 66 63"
    stroke="#ec4899"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
